name: CI

on:
  push:
    branches: ["main", "work", "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and type checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/rag"
      INTEGRATION_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/rag"
      JWT_SECRET_KEY: ci-local-secret-only
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q tests --ignore=tests/integration

      - name: Retrieval evaluation gate
        run: |
          python -m app.evaluation \
            --cases evals/retrieval_golden.json \
            --corpus evals/seed_corpus.json \
            --min-citation-recall 1.0 \
            --min-no-answer-accuracy 1.0 \
            --min-grounded-accuracy 1.0 \
            --min-case-pass-rate 1.0

      - name: PostgreSQL integration smoke test
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: |
          python -c "from app.db import init_db; init_db()"
          pytest -q tests/integration

      - name: Type check focused modules
        run: mypy

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker and deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose --env-file .env.example config >/dev/null

      - name: Build backend image
        run: docker build -t rag-finland-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t rag-finland-frontend:ci ./frontend

      - name: Check deployment manifests
        run: |
          test -f render.yaml
          test -f frontend/vercel.json
